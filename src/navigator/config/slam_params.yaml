slam_toolbox:
  ros__parameters:
    # Essential Frame Names
    odom_frame: odom
    map_frame: map
    base_frame: base_link  # <--- This MUST match your dummy_odom child_frame_id
    scan_topic: /scan
    use_sim_time: false

    # Standard Mapping Params
    mode: mapping
    transform_publish_period: 0.05
    map_update_interval: 5.0
    resolution: 0.05
    max_laser_range: 20.0