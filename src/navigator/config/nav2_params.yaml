/**:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom        # <--- Local costmap follows odom
      robot_base_frame: base_link # <--- Matches your dummy_odom.py
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # ... keep your obstacle_layer config below ...

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map         # <--- Global costmap follows map
      robot_base_frame: base_link # <--- Matches your dummy_odom.py
      rolling_window: false
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # Add these critics to fix the "No critics defined" error
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      RotateToGoal.scale: 32.0
      Oscillation.scale: 1.0
      ObstacleFootprint.scale: 0.01
      PathAlign.scale: 32.0
      PathDist.scale: 32.0
      GoalAlign.scale: 24.0
      GoalDist.scale: 24.0

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names: [
      'controller_server',
      'smoother_server',
      'planner_server',
      'behavior_server',
      'bt_navigator',
      'waypoint_follower',
      'velocity_smoother'
    ]
    # We intentionally exclude 'collision_monitor' and 'opennav_docking'

lifecycle_manager:
  ros__parameters:
    autostart: true
    # We redefine the list here to EXCLUDE collision_monitor
    node_names: ['controller_server', 'smoother_server', 'planner_server', 'behavior_server', 'bt_navigator', 'waypoint_follower', 'velocity_smoother']

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false

collision_monitor:
  ros__parameters:
    use_sim_time: false # Set to true if in simulation
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    transform_tolerance: 0.1
    source_timeout: 1.0
    stop_pub_timeout: 2.0
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
    polygons: ["footprint_stop"]
    footprint_stop:
      type: "stop"
      points: [0.3, 0.3, 0.3, -0.3, -0.3, -0.3, -0.3, 0.3]