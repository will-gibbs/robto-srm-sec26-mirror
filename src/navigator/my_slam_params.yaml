slam_toolbox:
  ros__parameters:
    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link  # <--- THIS IS THE KEY FIX
    scan_topic: /scan
    use_sim_time: false

    # Optional but helpful
    mode: mapping
    transform_publish_period: 0.05
    map_update_interval: 5.0
    resolution: 0.05
    max_laser_range: 20.0
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1